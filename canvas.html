<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JScratch Game Engine</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:block;background:#000}
#game-window{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#000}
#game-canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#variable-monitor{
    position:fixed;
    left:8px;
    bottom:8px;
    z-index:9999;
    min-width:180px;
    max-width:calc(100vw - 16px);
    padding:7px 10px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.2);
    border-radius:6px;
    color:#fff;
    font:14px/1.4 monospace;
    pointer-events:none;
    white-space:pre;
}
</style>
</head>
<body>

<div id="game-window">
    <canvas id="game-canvas"></canvas>
</div>

<div id="variable-monitor"></div>

<script src="js/back-process.js"></script>

<script src="js/ui.js"></script>
<script src="js/canvas.js"></script>
<script src="js/sensing.js"></script>
<script src="js/control.js"></script>
<script src="js/sprite.js"></script>
<script src="js/sound.js"></script>
<script src="js/motion.js"></script>
<script src="js/operator.js"></script>

<!-- Main scripts start here in order. -->
<script src="program/begin.js"></script>

<script>
const DEBUG_VARIABLES=[
    {name:"mouseX",value:()=>mouseX()},
    {name:"mouseY",value:()=>mouseY()},
];

const variableMonitor=document.getElementById("variable-monitor");

function updateVariableMonitor(){
    if(!variableMonitor)return;

    const lines=[];

    for(const variable of DEBUG_VARIABLES){
        try{
            let value=typeof variable.value==="function"
                ?resolveValue(variable.value())
                :resolveValue(variable.value);

            if(typeof value==="number"){
                if(!Number.isFinite(value))
                    value="NaN";
                else
                    value=Number(value.toFixed(3));
            }

            lines.push(variable.name+": "+String(value));
        }catch(error){
            lines.push(variable.name+": ERROR");
        }
    }

    variableMonitor.textContent=lines.join("\n");

    requestAnimationFrame(updateVariableMonitor);
}

updateVariableMonitor();
</script>

</body>
</html>
